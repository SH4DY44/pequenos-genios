<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/banner.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E40AF" />
    <meta
      name="description"
      content="Pequeños Genios - Plataforma educativa interactiva para niños"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Precargar recursos críticos -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <!-- Fallback para JavaScript deshabilitado -->
    <noscript>
      <style>
        body { 
          font-family: Arial, sans-serif; 
          text-align: center; 
          padding: 50px; 
          background: #f0f9ff; 
        }
        .no-js-message {
          background: white;
          padding: 40px;
          border-radius: 10px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          max-width: 500px;
          margin: 0 auto;
        }
        .no-js-message h1 { 
          color: #1E40AF; 
          margin-bottom: 20px; 
        }
        .no-js-message p { 
          color: #6B7280; 
          line-height: 1.6; 
        }
      </style>
    </noscript>
    
    <title>Pequeños Genios</title>
  </head>
  <body>
    <noscript>
      <div class="no-js-message">
        <h1>🚀 Pequeños Genios</h1>
        <p>Para usar esta aplicación necesitas tener JavaScript habilitado en tu navegador.</p>
        <p>Por favor, activa JavaScript e intenta de nuevo.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Loading inicial mientras carga React -->
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f0f9ff;
        font-family: 'Nunito', sans-serif;
      ">
        <div style="text-align: center;">
          <div style="
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB;
            border-left: 4px solid #1E40AF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
          "></div>
          <p style="color: #1E40AF; font-weight: 600; margin: 0;">
            Cargando Pequeños Genios...
          </p>
        </div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
